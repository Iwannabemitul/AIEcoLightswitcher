<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIEcoLightswitcher — Multi-Feed AI Vision & Lighting Command Hub</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <!-- Top Header Ribbon -->
  <header class="header-ribbon">
    <div class="brand-section">
      <div class="brand-logo">⚡</div>
      <div>
        <h1 class="brand-title">AIEcoLightswitcher</h1>
        <div class="brand-subtitle">Multi-Feed AI Vision & Multi-Pin Lighting Command Hub</div>
      </div>
    </div>

    <div class="header-telemetry">
      <div class="badge badge-cyan" id="badge-device">
        <span class="pulse-dot"></span>
        <span id="txt-device">INFERENCE: CPU</span>
      </div>
      <div class="badge badge-mint" id="badge-hardware">
        <span class="pulse-dot"></span>
        <span id="txt-hardware">ARDUINO: SIMULATION</span>
      </div>
      <div class="badge" id="badge-fps">
        <span>FPS: <strong id="txt-fps">0.0</strong></span>
      </div>
    </div>

    <div class="header-actions">
      <button id="btn-hardware-modal" title="Configure Arduino Serial Port">
        🔌 Arduino Comms
      </button>
      <button class="btn-primary" id="btn-open-add-modal">
        ➕ Add Video Feed
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-container">
    <!-- Top Stats Bar -->
    <section class="stats-bar" aria-label="Global System Telemetry">
      <div class="stat-tile">
        <div class="stat-label">Active Feeds</div>
        <div class="stat-value" id="stat-total-feeds">0 / 4+</div>
      </div>
      <div class="stat-tile">
        <div class="stat-label">Online Ingestion</div>
        <div class="stat-value" id="stat-online-feeds" style="color: var(--status-mint);">0 Active</div>
      </div>
      <div class="stat-tile">
        <div class="stat-label">Active Pin Relays</div>
        <div class="stat-value" id="stat-active-relays" style="color: var(--accent-cyan);">0 Output High</div>
      </div>
      <div class="stat-tile">
        <div class="stat-label">Energy Duty Cycle</div>
        <div class="stat-value" id="stat-duty-cycle" style="color: var(--status-amber);">SMART IDLE</div>
      </div>
    </section>

    <!-- Multi-Feed Responsive Grid (Minimum 4 Cards Always Maintained) -->
    <section class="feed-grid" id="feed-grid-container" aria-label="Video Feeds Grid">
      <!-- Injected dynamically by app.js: Active feed cards & Placeholder standby slots -->
    </section>
  </main>

  <!-- Add Feed Modal Dialog -->
  <dialog id="add-feed-dialog">
    <div class="modal-header">
      <h2 class="modal-title">Add New Video Feed</h2>
      <button class="btn-sm" id="btn-close-add-modal" type="button">✕</button>
    </div>

    <form id="form-add-feed">
      <div class="form-group">
        <label class="form-label" for="feed-name">Feed Name / Location</label>
        <input type="text" id="feed-name" class="form-control" required placeholder="e.g. Entrance Gate / Lab 101" value="Camera Feed">
      </div>

      <div class="form-group">
        <label class="form-label" for="feed-type">Input Stream Source</label>
        <select id="feed-type" class="form-control">
          <option value="DROIDCAM">Wi-Fi DroidCam (HTTP Stream)</option>
          <option value="USB">Local USB Webcam</option>
          <option value="RTSP">RTSP / HTTP Network Stream</option>
          <option value="MOCK_OCCUPIED">Synthetic Demo Feed (Occupied Scenario)</option>
          <option value="MOCK_EMPTY">Synthetic Demo Feed (Empty Room)</option>
        </select>
      </div>

      <!-- DroidCam Specific Options -->
      <div id="droidcam-options">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 0.5rem;">
          <div class="form-group">
            <label class="form-label" for="droidcam-ip">Phone IP Address</label>
            <input type="text" id="droidcam-ip" class="form-control" placeholder="192.168.1.15" value="192.168.1.5">
          </div>
          <div class="form-group">
            <label class="form-label" for="droidcam-port">Port</label>
            <input type="number" id="droidcam-port" class="form-control" placeholder="4747" value="4747">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="droidcam-path">Endpoint Path</label>
          <input type="text" id="droidcam-path" class="form-control" placeholder="/video" value="/video">
        </div>
      </div>

      <!-- USB Options -->
      <div id="usb-options" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="usb-index">Camera Device Index</label>
          <select id="usb-index" class="form-control">
            <option value="0">Camera 0 (Default Integrated / Primary)</option>
            <option value="1">Camera 1 (Secondary USB)</option>
            <option value="2">Camera 2 (Tertiary USB)</option>
          </select>
        </div>
      </div>

      <!-- RTSP Options -->
      <div id="rtsp-options" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="rtsp-url">Stream URL</label>
          <input type="text" id="rtsp-url" class="form-control" placeholder="rtsp://192.168.1.100:554/live">
        </div>
      </div>

      <!-- Arduino Pin Assignment -->
      <div class="form-group">
        <label class="form-label" for="feed-pin">Assigned Arduino GPIO Pin</label>
        <select id="feed-pin" class="form-control">
          <option value="13">Digital Pin 13 (Standard Built-in LED / Relay 1)</option>
          <option value="12">Digital Pin 12 (Relay 2)</option>
          <option value="11">Digital Pin 11 (Relay 3)</option>
          <option value="10">Digital Pin 10 (Relay 4)</option>
          <option value="9">Digital Pin 9 (Relay 5)</option>
          <option value="8">Digital Pin 8 (Relay 6)</option>
          <option value="7">Digital Pin 7 (Relay 7)</option>
          <option value="6">Digital Pin 6 (Relay 8)</option>
          <option value="5">Digital Pin 5</option>
          <option value="4">Digital Pin 4</option>
          <option value="3">Digital Pin 3</option>
          <option value="2">Digital Pin 2</option>
          <option value="14">Analog Pin A0 (Digital 14)</option>
          <option value="15">Analog Pin A1 (Digital 15)</option>
          <option value="16">Analog Pin A2 (Digital 16)</option>
          <option value="17">Analog Pin A3 (Digital 17)</option>
          <option value="18">Analog Pin A4 (Digital 18)</option>
          <option value="19">Analog Pin A5 (Digital 19)</option>
        </select>
      </div>

      <div class="modal-footer">
        <button type="button" id="btn-cancel-add-modal">Cancel</button>
        <button type="submit" class="btn-primary">Add Feed to Grid</button>
      </div>
    </form>
  </dialog>

  <!-- Hardware Comms Modal Dialog -->
  <dialog id="hardware-dialog">
    <div class="modal-header">
      <h2 class="modal-title">Arduino Uno / Nano Serial Configuration</h2>
      <button class="btn-sm" id="btn-close-hw-modal" type="button">✕</button>
    </div>

    <form id="form-hardware">
      <div class="form-group">
        <label class="form-label" for="hw-port">Select Serial Port</label>
        <select id="hw-port" class="form-control">
          <option value="SIMULATION">Virtual Simulation (No Hardware Required)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="hw-baud">Baud Rate</label>
        <select id="hw-baud" class="form-control">
          <option value="9600">9600 Baud (Standard Firmata / Uno)</option>
          <option value="115200">115200 Baud (High-Speed UART)</option>
        </select>
      </div>

      <div class="modal-footer">
        <button type="button" id="btn-hw-resync">Force Resync All Pins</button>
        <button type="submit" class="btn-primary">Connect Port</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
